# 取自生产 `nginx -T` 输出的精简复刻（含事故当时的真实拓扑）
# configuration file /etc/nginx/nginx.conf:
user www-data;
worker_processes auto;

http {
    include /etc/nginx/mime.types;
    sendfile on;

    # configuration file /etc/nginx/sites-enabled/wework.conf:
    server {
        listen 80;
        server_name wework.syzs.top;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name wework.syzs.top;

        root /var/www/zhiflow/frontend/dist;
        index index.html;

        location /api {
            proxy_pass http://127.0.0.1:3010;
            proxy_set_header Host $host;
        }

        location = /health {
            proxy_pass http://127.0.0.1:3010/health;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # 投流落地页，不是主应用
    server {
        listen 443 ssl http2;
        server_name wework.syzs.top;
        root /var/www/zhiflow/landing;

        location /lp {
            proxy_pass http://127.0.0.1:3000;
        }
    }

    server {
        listen 443 ssl http2;
        server_name crm.syzs.top;
        root /var/www/crm/dist;

        location /api {
            proxy_pass http://127.0.0.1:3001;
        }

        location /upload {
            proxy_pass http://127.0.0.1:3002/upload;
        }
    }

    server {
        listen 443 ssl http2;
        server_name ai.syzs.top;
        location / { proxy_pass http://127.0.0.1:8787; }
    }

    server {
        listen 443 ssl http2;
        server_name growth.syzs.top;
        root /var/www/growth/dist;
        location /api { proxy_pass http://127.0.0.1:3000; }
    }

    server {
        listen 443 ssl http2;
        server_name syzs.top www.syzs.top;
        root /var/www/site/dist;
        location /api { proxy_pass http://127.0.0.1:3011; }
    }
}
